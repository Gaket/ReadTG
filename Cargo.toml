[package]
name = "telegram-reader-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.4"
grammers-client = { version = "0.12", default-features = false }
grammers-mtsender = "0.12"
grammers-session = "0.12"
jiff = { version = "0.2", default-features = false }
libc = "0.2"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
zeroize = "1"
